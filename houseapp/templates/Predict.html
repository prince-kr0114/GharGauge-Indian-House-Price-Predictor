<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Indian House Price Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #bfdbfe, transparent 35%),
                #f8fafc;

            min-height: 100vh;
        }

        /* Main Card */

        .container {
            width: 100%;
            max-width: 1000px;

            margin: auto;
            padding: 35px;

            background: rgba(255, 255, 255, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 22px;

            box-shadow:
                0 20px 50px rgba(37, 99, 235, 0.12);

            animation: containerShow 0.7s ease;
        }

        /* Heading */

        h1 {
            text-align: center;
            margin: 0;

            font-size: 32px;
            color: #172554;

            animation: titleShow 0.8s ease;
        }

        h5 {
            text-align: center;

            margin: 8px 0 30px;

            color: #64748b;

            font-size: 14px;
            font-weight: 500;
        }

        /* Form Grid */

        .form-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 18px;
        }

        /* Input Group */

        .form-group {
            position: relative;

            animation: fieldShow 0.5s ease;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #334155;
        }

        input {
            width: 100%;

            height: 44px;

            padding: 10px 13px;

            border: 1px solid #dbe3ef;

            border-radius: 9px;

            background: #f8fafc;

            outline: none;

            font-size: 14px;

            color: #1e293b;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        /* Input Focus Animation */

        input:focus {
            border-color: #2874F0;

            background: white;

            box-shadow:
                0 0 0 3px rgba(40, 116, 240, 0.12);

            transform: translateY(-2px);
        }

        input:hover {
            border-color: #93b4ee;
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Buttons */

        .button-container {
            margin-top: 28px;

            display: flex;

            gap: 12px;
        }

        button {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* Predict Button */

        .predict-btn {
            background:
                linear-gradient(
                    135deg,
                    #2874F0,
                    #1d5fcc
                );

            box-shadow:
                0 8px 20px rgba(40, 116, 240, 0.25);
        }

        .predict-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(40, 116, 240, 0.35);
        }

        /* Reset Button */

        .reset-btn {
            background:
                linear-gradient(
                    135deg,
                    #64748b,
                    #475569
                );

            box-shadow:
                0 8px 20px rgba(71, 85, 105, 0.20);
        }

        .reset-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(71, 85, 105, 0.30);
        }

        button:active {
            transform: translateY(0);
        }

        /* Result */

        .result {
            margin-top: 28px;

            padding: 20px;

            text-align: center;

            background: #eff6ff;

            border: 1px solid #bfdbfe;

            border-radius: 12px;

            animation: resultShow 0.6s ease;
        }

        .result h2 {
            margin: 0 0 8px;

            font-size: 18px;

            color: #334155;
        }

        .result h3 {
            margin: 0;

            font-size: 28px;

            color: #166534;
        }

        /* Animations */

        @keyframes containerShow {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes titleShow {

            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes fieldShow {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes resultShow {

            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        /* Tablet */

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Mobile */

        @media (max-width: 550px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .button-container {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Indian House Price Prediction</h1>

    <h5>For Houses in India</h5>


    <form method="POST" id="houseForm">

        {% csrf_token %}


        <div class="form-grid">


            <!-- 1 -->

            <div class="form-group">

                <label>Bedrooms</label>

                <input
                    type="number"
                    name="bedrooms"
                    placeholder="e.g. 3"
                    value="{{ request.POST.bedrooms|default:'' }}"
                    required
                >

            </div>


            <!-- 2 -->

            <div class="form-group">

                <label>Bathrooms</label>

                <input
                    type="number"
                    step="0.1"
                    name="bathrooms"
                    placeholder="e.g. 2"
                    value="{{ request.POST.bathrooms|default:'' }}"
                    required
                >

            </div>


            <!-- 3 -->

            <div class="form-group">

                <label>Sqft Living</label>

                <input
                    type="number"
                    name="sqft_living"
                    placeholder="e.g. 2000"
                    value="{{ request.POST.sqft_living|default:'' }}"
                    required
                >

            </div>


            <!-- 4 -->

            <div class="form-group">

                <label>Sqft Lot</label>

                <input
                    type="number"
                    name="sqft_lot"
                    placeholder="e.g. 5000"
                    value="{{ request.POST.sqft_lot|default:'' }}"
                    required
                >

            </div>


            <!-- 5 -->

            <div class="form-group">

                <label>Floors</label>

                <input
                    type="number"
                    step="0.5"
                    name="floors"
                    placeholder="e.g. 2"
                    value="{{ request.POST.floors|default:'' }}"
                    required
                >

            </div>


            <!-- 6 -->

            <div class="form-group">

                <label>Waterfront</label>

                <input
                    type="number"
                    name="waterfront"
                    placeholder="0 or 1"
                    value="{{ request.POST.waterfront|default:'' }}"
                    required
                >

            </div>


            <!-- 7 -->

            <div class="form-group">

                <label>View</label>

                <input
                    type="number"
                    name="view"
                    placeholder="e.g. 0"
                    value="{{ request.POST.view|default:'' }}"
                    required
                >

            </div>


            <!-- 8 -->

            <div class="form-group">

                <label>Condition</label>

                <input
                    type="number"
                    name="condition"
                    placeholder="e.g. 3"
                    value="{{ request.POST.condition|default:'' }}"
                    required
                >

            </div>


            <!-- 9 -->

            <div class="form-group">

                <label>Sqft Above</label>

                <input
                    type="number"
                    name="sqft_above"
                    placeholder="e.g. 1800"
                    value="{{ request.POST.sqft_above|default:'' }}"
                    required
                >

            </div>


            <!-- 10 -->

            <div class="form-group">

                <label>Sqft Basement</label>

                <input
                    type="number"
                    name="sqft_basement"
                    placeholder="e.g. 500"
                    value="{{ request.POST.sqft_basement|default:'' }}"
                    required
                >

            </div>


            <!-- 11 -->

            <div class="form-group">

                <label>Year Built</label>

                <input
                    type="number"
                    name="yr_built"
                    placeholder="e.g. 2010"
                    value="{{ request.POST.yr_built|default:'' }}"
                    required
                >

            </div>


            <!-- 12 -->

            <div class="form-group">

                <label>Year Renovated</label>

                <input
                    type="number"
                    name="yr_renovated"
                    placeholder="e.g. 2020"
                    value="{{ request.POST.yr_renovated|default:'' }}"
                    required
                >

            </div>


            <!-- 13 -->

            <div class="form-group">

                <label>Street</label>

                <input
                    type="text"
                    name="street"
                    placeholder="e.g. Sector 62"
                    value="{{ request.POST.street|default:'' }}"
                    required
                >

            </div>


            <!-- 14 -->

            <div class="form-group">

                <label>City</label>

                <input
                    type="text"
                    name="city"
                    placeholder="e.g. Noida"
                    value="{{ request.POST.city|default:'' }}"
                    required
                >

            </div>


            <!-- 15 -->

            <div class="form-group">

                <label>State & PIN Code</label>

                <input
                    type="text"
                    name="statezip"
                    placeholder="e.g. UP 201301"
                    value="{{ request.POST.statezip|default:'' }}"
                    required
                >

            </div>


            <!-- 16 -->

            <div class="form-group">

                <label>Country</label>

                <input
                    type="text"
                    name="country"
                    placeholder="e.g. India"
                    value="{{ request.POST.country|default:'India' }}"
                    required
                >

            </div>


        </div>


        <!-- Buttons -->

        <div class="button-container">

            <button
                type="submit"
                class="predict-btn"
            >
                Predict House Price
            </button>


            <button
                type="button"
                class="reset-btn"
                onclick="document.getElementById('houseForm').reset();"
            >
                Reset Form
            </button>

        </div>


    </form>


    {% if result %}

        <div class="result">

            <h2>Predicted House Price</h2>

            <h3>{{ result }} lakhs</h3>

        </div>

    {% endif %}


</div>


</body>

</html>
